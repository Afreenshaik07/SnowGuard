services:
  dashboard:
    build: .
    container_name: snowguard_dashboard
    env_file:
      - .env
    ports:
      - "8501:8501"
    restart: unless-stopped
    command:
      - streamlit
      - run
      - app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501

  scheduler:
    build: .
    container_name: snowguard_scheduler
    env_file:
      - .env
    restart: unless-stopped
    command:
      - python
      - -m
      - app.pipeline.scheduler
